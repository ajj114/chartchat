<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>차트 채팅 프로토타입</title>
  <style>
    :root {
      --blue: #1188ff;
      --text: #111;
      --phone-w: 393px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #eef1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      color: var(--text);
      overscroll-behavior: none;
    }

    body {
      display: grid;
      place-items: start center;
      padding: 18px 0;
    }

    .phone {
      position: relative;
      width: min(100vw, var(--phone-w));
      overflow: hidden;
      background: #fff;
      box-shadow: 0 18px 55px rgba(0, 0, 0, .16);
      isolation: isolate;
      transition: top .18s ease;
    }

    @media (max-width: 480px) {
      body { display: block; padding: 0; background: #fff; }
      .phone { width: 100vw; box-shadow: none; }
    }

    .chart-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .control-cover {
      position: absolute;
      top: 21.3%;
      right: 2.8%;
      width: 25.5%;
      height: 4.2%;
      background: #fff;
      border-radius: 10px;
      z-index: 4;
    }

    .chat-toggle-wrap {
      position: absolute;
      top: 21.78%;
      right: 4.6%;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      color: #111;
    }

    .switch {
      width: 43px;
      height: 22px;
      border: 0;
      border-radius: 999px;
      background: #aeb5bd;
      padding: 2px;
      cursor: pointer;
      transition: background .18s ease;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.14);
    }

    .switch::before {
      content: "";
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.22);
      transform: translateX(0);
      transition: transform .18s ease;
    }

    .switch[aria-checked="true"] { background: var(--blue); }
    .switch[aria-checked="true"]::before { transform: translateX(21px); }

    .talk-btn {
      position: absolute;
      right: 4.7%;
      bottom: 26.9%;
      z-index: 6;
      min-width: 82px;
      height: 38px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(0, 104, 204, .28);
      cursor: pointer;
      touch-action: none;
      transform: translateY(8px) scale(.98);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .talk-btn.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .talk-btn.is-dragging {
      cursor: grabbing;
      transition: none;
      box-shadow: 0 8px 18px rgba(0, 104, 204, .34);
    }

    .keyboard-dim {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: none;
      border: 0;
      padding: 0;
      background: rgba(0, 0, 0, .07);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .keyboard-dim.is-open { display: block; }

    .chat-layer {
      position: absolute;
      left: 0;
      right: 0;
      top: 29.4%;
      bottom: 27.5%;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
    }

    .floating-chat {
      position: absolute;
      max-width: 58%;
      font-size: 12px;
      line-height: 1.38;
      color: rgba(0, 0, 0, .82);
      text-shadow: 0 1px 0 rgba(255,255,255,.7);
      white-space: normal;
      word-break: break-word;
      animation: floatUp 4.8s linear forwards;
    }

    .floating-chat .name {
      display: block;
      margin-bottom: 2px;
      color: rgba(0, 0, 0, .42);
      font-weight: 700;
    }

    .floating-chat .msg {
      display: block;
      font-weight: 700;
    }

    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(18px); }
      9%   { opacity: 1; }
      78%  { opacity: .92; }
      100% { opacity: 0; transform: translateY(-92px); }
    }

    .input-panel {
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: 34.6%;
      z-index: 12;
      display: none;
      align-items: center;
      gap: 6px;
      min-height: 36px;
    }

    .input-panel.is-open { display: flex; }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 34px;
      padding: 0 10px;
      border: 1px solid rgba(0, 0, 0, .25);
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 16px;
      outline: none;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }

    .chat-input::placeholder { color: #a6aeb7; font-size: 13px; }
    .chat-input:focus { border-color: var(--blue); }

    .send-btn {
      width: 70px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .count {
      position: absolute;
      right: 80px;
      top: -16px;
      padding: 2px 5px;
      border-radius: 999px;
      background: rgba(17, 24, 39, .74);
      color: #fff;
      font-size: 10px;
      line-height: 1;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .15s ease, transform .15s ease;
    }

    .input-panel:focus-within .count {
      opacity: 1;
      transform: translateY(0);
    }

    .desktop-keyboard {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34.2%;
      z-index: 10;
      display: none;
      padding: 10px 4px 8px;
      background: #2d2d2d;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .desktop-keyboard.is-open { display: block; }

    @media (hover: none) and (pointer: coarse) {
      .desktop-keyboard { display: none !important; }
    }

    .key-row { display: grid; gap: 6px; margin-bottom: 8px; }
    .key-row.r1 { grid-template-columns: repeat(10, 1fr); }
    .key-row.r2 { grid-template-columns: repeat(9, 1fr); padding: 0 18px; }
    .key-row.r3 { grid-template-columns: 1.25fr repeat(7, 1fr) 1.25fr; }
    .key-row.r4 { grid-template-columns: 1.05fr 1.05fr 5fr 1.9fr; }

    .key {
      min-height: 40px;
      border: 0;
      border-radius: 5px;
      background: #666;
      color: #fff;
      font-size: 18px;
      box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 1px 1px rgba(0,0,0,.35);
      cursor: pointer;
    }

    .key.func { background: #4a4a4a; font-size: 16px; }
    .key.space { font-size: 13px; color: rgba(255,255,255,.9); }
    .key.enter { font-size: 21px; }
    .key:active { transform: translateY(1px); filter: brightness(1.12); }

    .toast {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 30;
      width: min(82%, 330px);
      padding: 14px 16px;
      border: 0;
      border-radius: 16px;
      background: rgba(17, 24, 39, .88);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .24);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.96);
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>
  <main class="phone" id="phone" aria-label="삼성전자 차트 채팅 화면">
    <img class="chart-img" src="assets/chart_base.png" alt="삼성전자 차트 화면" />

    <div class="control-cover" aria-hidden="true"></div>
    <div class="chat-toggle-wrap">
      <span>채팅</span>
      <button class="switch" id="chatSwitch" role="switch" aria-checked="false" aria-label="채팅 켜기"></button>
    </div>

    <div class="chat-layer" id="chatLayer" aria-live="polite"></div>
    <button class="keyboard-dim" id="chatDim" type="button" aria-label="채팅 입력창 닫기"></button>
    <button class="talk-btn" id="talkBtn" type="button">말하기</button>

    <form class="input-panel" id="inputPanel" autocomplete="off">
      <span class="count" id="count">0/30</span>
      <input
        class="chat-input"
        id="chatInput"
        type="text"
        inputmode="text"
        maxlength="30"
        placeholder="채팅을 입력하세요."
        aria-label="채팅 입력"
      />
      <button class="send-btn" type="submit">보내기</button>
    </form>

    <section class="desktop-keyboard" id="fakeKeyboard" aria-hidden="true">
      <div class="key-row r1">
        <button class="key" data-key="ㅂ">ㅂ</button><button class="key" data-key="ㅈ">ㅈ</button><button class="key" data-key="ㄷ">ㄷ</button><button class="key" data-key="ㄱ">ㄱ</button><button class="key" data-key="ㅅ">ㅅ</button><button class="key" data-key="ㅛ">ㅛ</button><button class="key" data-key="ㅕ">ㅕ</button><button class="key" data-key="ㅑ">ㅑ</button><button class="key" data-key="ㅐ">ㅐ</button><button class="key" data-key="ㅔ">ㅔ</button>
      </div>
      <div class="key-row r2">
        <button class="key" data-key="ㅁ">ㅁ</button><button class="key" data-key="ㄴ">ㄴ</button><button class="key" data-key="ㅇ">ㅇ</button><button class="key" data-key="ㄹ">ㄹ</button><button class="key" data-key="ㅎ">ㅎ</button><button class="key" data-key="ㅗ">ㅗ</button><button class="key" data-key="ㅓ">ㅓ</button><button class="key" data-key="ㅏ">ㅏ</button><button class="key" data-key="ㅣ">ㅣ</button>
      </div>
      <div class="key-row r3">
        <button class="key func" data-action="shift">⇧</button><button class="key" data-key="ㅋ">ㅋ</button><button class="key" data-key="ㅌ">ㅌ</button><button class="key" data-key="ㅊ">ㅊ</button><button class="key" data-key="ㅍ">ㅍ</button><button class="key" data-key="ㅠ">ㅠ</button><button class="key" data-key="ㅜ">ㅜ</button><button class="key" data-key="ㅡ">ㅡ</button><button class="key func" data-action="backspace">⌫</button>
      </div>
      <div class="key-row r4">
        <button class="key func" data-key="123">123</button><button class="key func" data-key="😊">😊</button><button class="key space" data-key=" ">스페이스</button><button class="key func enter" data-action="send">↵</button>
      </div>
    </section>

    <div class="toast" id="toast" role="status">우측상단에 채팅기능을 활성화 해보세요.</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const phone = document.getElementById('phone');
    const chatSwitch = document.getElementById('chatSwitch');
    const talkBtn = document.getElementById('talkBtn');
    const inputPanel = document.getElementById('inputPanel');
    const chatDim = document.getElementById('chatDim');
    const chatInput = document.getElementById('chatInput');
    const chatLayer = document.getElementById('chatLayer');
    const count = document.getElementById('count');
    const fakeKeyboard = document.getElementById('fakeKeyboard');
    const toast = document.getElementById('toast');

    const MAX_LENGTH = 30;
    const ROOM_ID = '005930';
    const SUPABASE_URL = 'https://slakmkiwcqycfxiqiiuc.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_BzUwzaEOsLnjDgOFOS_J5g_UvbkgBDH';
    const supabaseClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const myNickBase = makeNickName();
    const myName = `${myNickBase} (나)`;
    const pendingLocalMessages = [];
    let chatOn = false;
    let inputOpen = false;
    let realtimeStatus = 'INIT';

    const LONG_PRESS_MS = 320;
    const MOVE_TOLERANCE = 8;
    let pressTimer = null;
    let activePointerId = null;
    let dragReady = false;
    let movedDuringPress = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let startPointerX = 0;
    let startPointerY = 0;
    let latestPointerX = 0;
    let latestPointerY = 0;

    function makeNickName() {
      const a = ['비루한', '배고픈', '성급한', '침착한', '수줍은', '용감한', '행복한'];
      const b = ['강아지', '뚱땡이', '고양이', '기린', '토끼', '개미', '펭귄'];
      return a[Math.floor(Math.random() * a.length)] + ' ' + b[Math.floor(Math.random() * b.length)];
    }

    function showToast(message, duration = 2600) {
      toast.textContent = message;
      toast.classList.add('is-visible');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('is-visible'), duration);
    }

    function setChatState(next) {
      chatOn = next;
      chatSwitch.setAttribute('aria-checked', String(chatOn));
      chatSwitch.setAttribute('aria-label', chatOn ? '채팅 끄기' : '채팅 켜기');

      if (chatOn) {
        if (!inputOpen) talkBtn.classList.add('is-visible');
        if (realtimeStatus !== 'SUBSCRIBED') console.log('Realtime not ready yet:', realtimeStatus);
      } else {
        closeInput(false);
        clearTalkPressState();
        chatLayer.innerHTML = '';
        talkBtn.classList.remove('is-visible');
      }
    }

    function openInput() {
      if (!chatOn) return;
      inputOpen = true;
      talkBtn.classList.remove('is-visible');
      chatDim.classList.add('is-open');
      inputPanel.classList.add('is-open');
      if (!isTouchMobile()) fakeKeyboard.classList.add('is-open');
      syncInputPosition();
      requestAnimationFrame(() => {
        chatInput.focus({ preventScroll: false });
        syncInputPosition();
      });
    }

    function closeInput(restoreTalk = true) {
      inputOpen = false;
      chatDim.classList.remove('is-open');
      inputPanel.classList.remove('is-open');
      fakeKeyboard.classList.remove('is-open');
      chatInput.value = '';
      updateCount();
      chatInput.blur();
      resetInputPanelPosition();
      phone.style.top = '';
      if (restoreTalk && chatOn) talkBtn.classList.add('is-visible');
    }

    function resetInputPanelPosition() {
      inputPanel.style.position = '';
      inputPanel.style.left = '';
      inputPanel.style.right = '';
      inputPanel.style.width = '';
      inputPanel.style.bottom = '';
      inputPanel.style.zIndex = '';
    }

    function isTouchMobile() {
      return matchMedia('(hover: none) and (pointer: coarse)').matches;
    }

    function syncInputPosition() {
      if (!inputOpen) return;

      if (window.visualViewport && isTouchMobile()) {
        const rect = phone.getBoundingClientRect();
        const keyboardHeight = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
        const keyboardGap = Math.max(8, keyboardHeight + 8);
        const shift = Math.max(0, keyboardHeight - 12);

        phone.style.top = shift ? `-${shift}px` : '';
        inputPanel.style.position = 'fixed';
        inputPanel.style.left = `${Math.max(rect.left + 8, 8)}px`;
        inputPanel.style.width = `${Math.max(rect.width - 16, 280)}px`;
        inputPanel.style.right = 'auto';
        inputPanel.style.bottom = `${keyboardGap}px`;
        inputPanel.style.zIndex = '1000';
        return;
      }

      resetInputPanelPosition();
    }

    function enterTalkDragMode() {
      if (activePointerId === null || !chatOn || inputOpen) return;
      dragReady = true;
      talkBtn.classList.add('is-dragging');
      moveTalkButton(latestPointerX, latestPointerY);
    }

    function moveTalkButton(clientX, clientY) {
      const phoneRect = phone.getBoundingClientRect();
      const btnRect = talkBtn.getBoundingClientRect();
      const minLeft = 4;
      const minTop = 4;
      const maxLeft = phoneRect.width - btnRect.width - 4;
      const maxTop = phoneRect.height - btnRect.height - 4;

      const nextLeft = clientX - phoneRect.left - dragOffsetX;
      const nextTop = clientY - phoneRect.top - dragOffsetY;
      const clampedLeft = Math.max(minLeft, Math.min(nextLeft, maxLeft));
      const clampedTop = Math.max(minTop, Math.min(nextTop, maxTop));

      talkBtn.style.left = `${clampedLeft}px`;
      talkBtn.style.top = `${clampedTop}px`;
      talkBtn.style.right = 'auto';
      talkBtn.style.bottom = 'auto';
    }

    function clearTalkPressState() {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      talkBtn.classList.remove('is-dragging');
      activePointerId = null;
      dragReady = false;
      movedDuringPress = false;
    }

    function updateCount() {
      count.textContent = `${chatInput.value.length}/${MAX_LENGTH}`;
    }

    async function sendChat() {
      const text = chatInput.value.slice(0, MAX_LENGTH);
      if (!text.trim()) return;

      addFloatingChat(myName, text);
      pendingLocalMessages.push({ nickname: myNickBase, message: text, at: Date.now() });
      chatInput.value = '';
      updateCount();
      chatInput.focus();
      await saveChatMessage(text);
    }

    async function saveChatMessage(message) {
      if (!supabaseClient) {
        console.warn('Supabase client가 준비되지 않았습니다.');
        if (chatOn) addFloatingChat('시스템', 'Supabase 연결 실패');
        return;
      }

      const { error } = await supabaseClient
        .from('chat_messages')
        .insert({ room: ROOM_ID, nickname: myNickBase, message });

      if (error) {
        console.error('채팅 저장 실패:', error);
        if (chatOn) addFloatingChat('시스템', '채팅 저장 실패');
      }
    }

    function shouldSkipMyEcho(nickname, message) {
      const now = Date.now();
      for (let i = pendingLocalMessages.length - 1; i >= 0; i -= 1) {
        if (now - pendingLocalMessages[i].at > 7000) pendingLocalMessages.splice(i, 1);
      }

      const foundIndex = pendingLocalMessages.findIndex((item) => item.nickname === nickname && item.message === message);
      if (foundIndex >= 0) {
        pendingLocalMessages.splice(foundIndex, 1);
        return true;
      }
      return false;
    }

    function handleIncomingChat(row) {
      if (!row || row.room !== ROOM_ID) return;
      if (!chatOn) return;
      if (shouldSkipMyEcho(row.nickname, row.message)) return;
      addFloatingChat(row.nickname, String(row.message || '').slice(0, MAX_LENGTH));
    }

    function subscribeRealtimeChat() {
      if (!supabaseClient) {
        console.warn('Supabase client가 준비되지 않았습니다.');
        return;
      }

      supabaseClient
        .channel(`chart-chat:${ROOM_ID}`)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'chat_messages',
          filter: `room=eq.${ROOM_ID}`
        }, (payload) => handleIncomingChat(payload.new))
        .subscribe((status) => {
          realtimeStatus = status;
          console.log('Supabase Realtime 상태:', status);
        });
    }

    function addFloatingChat(name, message) {
      if (!chatOn && name !== '시스템') return;
      const item = document.createElement('div');
      item.className = 'floating-chat';
      item.style.left = `${Math.floor(5 + Math.random() * 56)}%`;
      item.style.top = `${Math.floor(36 + Math.random() * 43)}%`;

      const nameEl = document.createElement('span');
      nameEl.className = 'name';
      nameEl.textContent = name;

      const msgEl = document.createElement('span');
      msgEl.className = 'msg';
      msgEl.textContent = message;

      item.append(nameEl, msgEl);
      chatLayer.appendChild(item);
      item.addEventListener('animationend', () => item.remove(), { once: true });
    }

    chatSwitch.addEventListener('click', () => setChatState(!chatOn));

    talkBtn.addEventListener('pointerdown', (e) => {
      if (!chatOn || inputOpen) return;
      activePointerId = e.pointerId;
      dragReady = false;
      movedDuringPress = false;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      latestPointerX = e.clientX;
      latestPointerY = e.clientY;

      const btnRect = talkBtn.getBoundingClientRect();
      dragOffsetX = e.clientX - btnRect.left;
      dragOffsetY = e.clientY - btnRect.top;

      talkBtn.setPointerCapture?.(e.pointerId);
      pressTimer = setTimeout(enterTalkDragMode, LONG_PRESS_MS);
    });

    talkBtn.addEventListener('pointermove', (e) => {
      if (activePointerId !== e.pointerId) return;
      latestPointerX = e.clientX;
      latestPointerY = e.clientY;
      if (Math.hypot(e.clientX - startPointerX, e.clientY - startPointerY) > MOVE_TOLERANCE) movedDuringPress = true;
      if (dragReady) {
        e.preventDefault();
        moveTalkButton(e.clientX, e.clientY);
      }
    });

    talkBtn.addEventListener('pointerup', (e) => {
      if (activePointerId !== e.pointerId) return;
      const shouldOpenInput = !dragReady && !movedDuringPress;
      if (pressTimer) clearTimeout(pressTimer);
      talkBtn.releasePointerCapture?.(e.pointerId);
      clearTalkPressState();
      if (shouldOpenInput) openInput();
    });

    talkBtn.addEventListener('pointercancel', (e) => {
      if (activePointerId !== e.pointerId) return;
      if (pressTimer) clearTimeout(pressTimer);
      talkBtn.releasePointerCapture?.(e.pointerId);
      clearTalkPressState();
    });

    talkBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openInput();
      }
    });

    chatDim.addEventListener('click', () => {
      if (inputOpen) closeInput(true);
    });

    chatInput.addEventListener('input', updateCount);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        sendChat();
      }
      if (e.key === 'Escape') closeInput(true);
    });

    inputPanel.addEventListener('submit', (e) => {
      e.preventDefault();
      sendChat();
    });

    fakeKeyboard.addEventListener('click', (e) => {
      const key = e.target.closest('.key');
      if (!key) return;
      e.preventDefault();

      const action = key.dataset.action;
      if (action === 'backspace') {
        chatInput.value = chatInput.value.slice(0, -1);
      } else if (action === 'send') {
        sendChat();
        return;
      } else if (key.dataset.key && chatInput.value.length < MAX_LENGTH) {
        chatInput.value = (chatInput.value + key.dataset.key).slice(0, MAX_LENGTH);
      }
      updateCount();
      chatInput.focus();
    });

    window.addEventListener('resize', syncInputPosition);
    window.visualViewport?.addEventListener('resize', syncInputPosition);
    window.visualViewport?.addEventListener('scroll', syncInputPosition);

    setChatState(false);
    updateCount();
    subscribeRealtimeChat();
    window.setTimeout(() => showToast('우측상단에 채팅기능을 활성화 해보세요.'), 350);
  </script>
</body>
</html>
